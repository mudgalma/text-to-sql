[project]
name = "intelligent-analytics-query-engine"
version = "0.1.0"
description = "A modular natural-language analytics query engine."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.79,<1",
    "duckdb>=1.1,<2",
    "pandas>=2.1,<3",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
